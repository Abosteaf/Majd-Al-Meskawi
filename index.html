<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مجد المسكاوي | Majd Al-Meskawi</title>
  <meta name="description" content="مجد المسكاوي – المدير العام التنفيذي لشركة آفاق الشرق للسياحة والسفر. Majd Al-Meskawi – Tourism, Travel, Hajj and Umrah.">
  <meta name="theme-color" content="#800020">
  <link rel="icon" href="assets/profile.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Apply saved/system theme before paint to avoid a flash */
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('lang') || 'ar';
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Site-wide background video (sits behind everything; see css/style.css + js/main.js) -->
  <video class="bg-video" id="bgVideo" autoplay muted loop playsinline preload="auto" poster="assets/bg-image.jpg" aria-hidden="true" tabindex="-1" disablepictureinpicture>
    <source src="assets/bg-video.mp4" type="video/mp4">
  </video>

  <!-- News ticker -->
  <div class="ticker" role="marquee" aria-label="Majd Al-Meskawi Tourism &amp; Travel">
    <div class="ticker__track" id="tickerTrack" aria-hidden="true"></div>
  </div>

  <!-- Top controls -->
  <div class="controls">
    <button class="ctrl" id="langBtn" type="button" aria-label="Switch language"><span id="langLabel">EN</span></button>
    <button class="ctrl ctrl--icon" id="themeBtn" type="button" aria-label="Toggle dark mode">
      <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <main>
    <section class="profile" id="top" aria-labelledby="name">
      <div class="avatar">
        <img src="assets/profile.jpg" alt="مجد المسكاوي" id="avatarImg" width="640" height="640" decoding="async">
      </div>
      <h1 id="name" data-i18n="name">مجد المسكاوي</h1>
      <div class="roles">
        <p class="role role--main" data-i18n="role1"></p>
        <p class="role" data-i18n="role2"></p>
        <p class="role" data-i18n="role3"></p>
        <p class="role" data-i18n="role4"></p>
      </div>
    </section>

    <section class="contact" aria-labelledby="contactTitle">
      <h2 id="contactTitle" data-i18n="contactTitle">طرق التواصل</h2>
      <ul class="cards" id="cards"></ul>
      <p class="toast" id="toast" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="footer">
    <p data-i18n="footerName">مجد المسكاوي للسياحة والسفر</p>
    <p class="footer__copy">&copy; <span id="year"></span> <span data-i18n="rights"></span></p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
